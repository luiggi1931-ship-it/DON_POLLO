<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Don Pollito | Sistema de Gestión</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  
  {% block extra_css %}{% endblock %}
</head>

<body>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Menu">
    <i class="fas fa-bars"></i>
  </button>

  <div class="container">
    <!-- ASIDE / SIDEBAR -->
    <aside class="sidebar" id="mainSidebar">
      <div class="logo">
        <img src="{{ url_for('static', filename='img/DON_pollo_ITB.png') }}" class="logo-img" alt="Don Pollo Logo" />
        <span>DON POLLITO</span>
      </div>
      
      <nav class="sidebar-nav">
        <ul>
          <li class="{% if request.endpoint == 'main.dashboard' or request.path == '/' %}active{% endif %}">
            <a href="{{ url_for('main.dashboard') }}" class="nav-btn">
              <i class="fas fa-th-large"></i> <span>Dashboard</span>
            </a>
          </li>
          
          <li class="{% if request.endpoint == 'main.lotes' %}active{% endif %}">
            <a href="{{ url_for('main.lotes') }}" class="nav-btn">
              <i class="fas fa-boxes-stacked"></i> <span>Lotes</span>
            </a>
          </li>
          
          <li class="{% if request.endpoint == 'main.configuracion' %}active{% endif %}">
            <a href="{{ url_for('main.configuracion') }}" class="nav-btn">
              <i class="fas fa-cogs"></i> <span>Configuración</span>
            </a>
          </li>
          
          <li class="{% if request.endpoint == 'main.reportes' %}active{% endif %}">
            <a href="{{ url_for('main.reportes') }}" class="nav-btn">
              <i class="fas fa-clipboard-list"></i> <span>Reportes</span>
            </a>
          </li>
          
          <li class="{% if request.endpoint == 'main.pruebas' %}active{% endif %}">
            <a href="{{ url_for('main.pruebas') }}" class="nav-btn">
              <i class="fas fa-flask"></i> <span>Pruebas</span>
            </a>
          </li>
        </ul>

        <div class="sidebar-spacer" style="flex-grow: 1;"></div>

        <div class="music-player-card">
          <div class="music-info">
            <h4 id="song-title">Cargando...</h4>
            <p id="song-artist">Seleccione música</p>
          </div>

          <div class="progress-container" id="progress-container">
            <div class="progress" id="progress"></div>
          </div>

          <div class="music-controls">
            <button id="prev-btn" class="control-btn"><i class="fas fa-backward"></i></button>
            <button id="play-btn" class="control-btn play-main"><i class="fas fa-play"></i></button>
            <button id="next-btn" class="control-btn"><i class="fas fa-forward"></i></button>
          </div>

          <div class="volume-control">
            <i class="fas fa-volume-down small-icon"></i>
            <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5">
          </div>

          <audio id="audio-player"></audio>
        </div>
      </nav>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
      <header class="top-bar">
        <div class="icon-bell"></div>
        <span> Notificaciones </span>
      </header>

      <div class="content-area">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>

  <!-- Scripts Globales -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="{{ url_for('static', filename='js/base.js') }}"></script>
  <script src="{{ url_for('static', filename='js/musica.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
